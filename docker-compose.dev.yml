# 本地开发数据库环境:PostgreSQL + PostGIS + pgAdmin 管理工具
# 用法:
#   启动: docker compose -f docker-compose.dev.yml up -d
#   停止: docker compose -f docker-compose.dev.yml down
#   清库: docker compose -f docker-compose.dev.yml down -v
#
# 连接串(供 packages/backend/.env 的 DATABASE_URL):
#   postgresql://nongchang:nongchang@127.0.0.1:5544/nongchang?schema=public
#
# pgAdmin 管理界面: http://localhost:5050
#   登录邮箱: admin@admin.com   密码: admin
#   首次进入后“Add New Server” → Host 填 db、端口 5432、用户 nongchang、密码 nongchang

services:
  redis:
    image: redis:7.4-alpine
    container_name: ${REDIS_CONTAINER_NAME:-nongchang-redis}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_HOST_PORT:-56379}:6379"
    volumes:
      - nongchang_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgis/postgis:16-3.4
    container_name: ${POSTGRES_CONTAINER_NAME:-nongchang-postgis}
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_USER: nongchang
      POSTGRES_PASSWORD: nongchang
      POSTGRES_DB: nongchang
    ports:
      # 宿主 5432 被 WSL 内的另一个 Postgres(经 wslrelay 占用 127.0.0.1/::1)抢占,
      # localhost 会解析到那个库导致认证失败;故容器映射到宿主 5544 规避冲突。
      - "${POSTGRES_HOST_PORT:-5544}:5432"
    volumes:
      - nongchang_pgdata:/var/lib/postgresql/data
      - ./ops/postgres/enable-observability.sql:/docker-entrypoint-initdb.d/20-observability.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nongchang -d nongchang"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: ${PGADMIN_CONTAINER_NAME:-nongchang-pgadmin}
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - nongchang_pgadmin:/var/lib/pgadmin

volumes:
  nongchang_pgdata:
  nongchang_pgadmin:
  nongchang_redis:
